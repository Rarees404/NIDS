# PyNIDS — local IP indicator list
#
# Your own indicators, added to the live feeds (`pynids intel update`).
# CIDR notation supported.  Only real indicators belong here: every entry
# raises alerts on live traffic.
#
# Severity values: LOW, MEDIUM, HIGH, CRITICAL
# Category suggestions: tor_exit, c2, scanner, botnet, proxy, malware
#
#   - cidr: "192.0.2.0/24"
#     category: c2
#     severity: HIGH
#     description: "Where this indicator came from"

entries:
  # Tor exit relay ranges (also covered, address by address, by the live
  # tor_exits feed)
  - cidr: "185.220.101.0/24"
    category: tor_exit
    severity: MEDIUM
    description: "Tor exit relay range"

  - cidr: "185.220.102.0/24"
    category: tor_exit
    severity: MEDIUM
    description: "Tor exit relay range"
