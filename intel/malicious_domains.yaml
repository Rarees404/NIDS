# PyNIDS — local domain indicator list
#
# Your own indicators, added to the live feeds (`pynids intel update`).
# Exact matches, or suffix patterns (prefix with "." to match all subdomains).
# Only real indicators belong here: every entry raises alerts on live traffic.
#
# Severity values: LOW, MEDIUM, HIGH, CRITICAL
# Category suggestions: c2, malware, phishing, tor_proxy, dga, spam
#
#   - domain: "bad.example"
#     category: c2
#     severity: HIGH
#     description: "Where this indicator came from"

entries:
  # Tor proxies
  - domain: ".onion.to"
    category: tor_proxy
    severity: MEDIUM
    description: "Tor2Web proxy suffix — anonymous routing"

  - domain: ".tor2web.org"
    category: tor_proxy
    severity: MEDIUM
    description: "Tor2Web proxy suffix"

  # Dynamic DNS providers often abused for C2
  - domain: ".duckdns.org"
    category: dyndns
    severity: LOW
    description: "Free dynamic DNS — frequently abused for C2 staging"

  - domain: ".no-ip.com"
    category: dyndns
    severity: LOW
    description: "Free dynamic DNS — frequently abused for C2 staging"
