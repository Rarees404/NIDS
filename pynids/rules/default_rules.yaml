  - id: "SIG-EXF-001"
    description: "High rate of DNS TXT queries (possible DNS exfiltration)"
    message: "Many DNS TXT queries from {src_ip}"
    severity: MEDIUM
    confidence: 0.5
    mitre: "T1048.003"
    tags: [exfiltration, dns]
    match:
      all:
        - {field: dst_port, op: eq, value: 53}
        - {field: layer7.dns.is_response, op: eq, value: false}
        - {field: layer7.dns.query_type, op: eq, value: TXT}
        - {not: {field: layer7.dns.query_name, op: regex, value: '(\.local|\.arpa|_domainkey\..+|^_dmarc\..+|^_spf\..+)$'}}
    threshold: {count: 25, seconds: 60}
    why: "TXT records hold free-form text, which makes them the favourite carrier for DNS tunnels and for malware fetching commands. A single TXT lookup is routine (mail checks, domain verification); dozens a minute are not."
    response: "Look at the names being queried — encoded-looking subdomains of one domain confirm a tunnel."
    action: alert

