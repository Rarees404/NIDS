  # =========================================================================
  # Hygiene — weak or outdated protocols
  # =========================================================================

  - id: "SIG-POL-001"
    description: "Outdated TLS version offered (TLS 1.0 / 1.1)"
    message: "Outdated {layer7.tls.tls_version} offered by {src_ip} to {dst_ip}"
    severity: LOW
    confidence: 0.9
    tags: [policy, tls, weak_crypto]
    match:
      all:
        - {field: layer7.tls.tls_version, op: in, value: ["TLS 1.0", "TLS 1.1"]}
        - {field: dst_scope, op: ne, value: loopback}
    threshold: {count: 3, seconds: 300, track_by: pair}
    why: "TLS 1.0 and 1.1 were retired in 2021. Current software offers 1.2 or 1.3; a client that tops out lower is old enough to have other unpatched problems."
    response: "Update the program that made the connection."
    action: alert

  - id: "SIG-POL-002"
    description: "SSH protocol version 1 in use"
    message: "SSH protocol 1 banner ({layer7.ssh.software}) between {src_ip} and {dst_ip}"
    severity: MEDIUM
    confidence: 0.9
    tags: [policy, ssh, weak_crypto]
    match:
      all:
        - {field: layer7.ssh.proto_version, op: regex, value: '^1\.[0-8]'}
    why: "SSH-1 has design flaws that allow session hijacking. It was replaced in 2006."
    response: "Upgrade or retire the device that still speaks it."
    action: alert

  - id: "SIG-POL-003"
    description: "SNMP request with the default 'public' community"
    message: "SNMP with default community 'public': {src_ip} → {dst_ip}"
    severity: LOW
    confidence: 0.7
    mitre: "T1602.001"
    tags: [policy, snmp, discovery]
    match:
      all:
        - {field: protocol, op: eq, value: udp}
        - {field: dst_port, op: eq, value: 161}
        - {field: payload_bytes, op: contains, value: '\x04\x06public'}
        - {field: src_scope, op: ne, value: loopback}
    threshold: {count: 5, seconds: 60}
    why: "SNMP v1/v2c with the factory community string hands device configuration to anyone who asks. Printer drivers poll this way; so do network mappers."
    response: "Change the community string or move the device to SNMPv3."
