# PyNIDS signature rules — the built-in, tuned ruleset.
#
# The daemon loads this file by default.  To retune without editing it, put
# overrides in "rules.yaml" in the PyNIDS data directory: a rule with the same
# id replaces the built-in one, and a partial entry changes single settings:
#
#   rules:
#     - {id: SIG-C2-006, enabled: false}       # switch a rule off
#     - {id: SIG-POL-001, severity: MEDIUM}    # change one field
#
# Language reference: pynids/detection/signature.py.  In short:
#
#   Operators  eq ne lt gt lte gte in not_in contains not_contains startswith
#              endswith regex cidr exists
#   Fields     src_ip dst_ip src_port dst_port protocol payload_bytes payload_len
#              layer7.<proto>.<field>   (http, dns, tls, quic, ssh, smtp)
#              tcp.syn  tcp.null  tcp.xmas          (a "syn" is a connection attempt)
#              direction                            (outbound | inbound | local | transit)
#              src_scope  dst_scope                 (public | private | loopback | link_local | multicast)
#              flow.new  flow.packets  flow.bytes_out …   context.app  context.country …
#   Text operators read the payload byte-for-byte; \xNN in a value is one raw byte.
#   Regexes are case-insensitive.
#
# Tuning principles used here:
#   * A port number alone is never an attack.  Port rules match the opening
#     SYN only (one alert per connection, never on replies) and say which
#     direction and address scope makes the connection worth reporting.
#   * Web attacks (SQL injection, XSS, path traversal, scanner user-agents)
#     are reported by the HTTP behavioural detector, which knows request
#     direction — they are not duplicated here.
#   * Confidence reflects how often the pattern is benign in real traffic.
#
# MITRE ATT&CK references: https://attack.mitre.org/

rules:

  # =========================================================================
  # Reconnaissance
  # =========================================================================

  - id: "SIG-REC-002"
    description: "DNS lookup for a domain in a frequently abused top-level domain"
    message: "DNS lookup for {layer7.dns.query_name} (frequently abused top-level domain)"
    severity: LOW
    confidence: 0.3
    mitre: "T1071.004"
    tags: [dns, suspicious_tld]
    match:
      all:
        - {field: dst_port, op: eq, value: 53}
        - {field: layer7.dns.is_response, op: eq, value: false}
        - {field: layer7.dns.query_name, op: regex,
           value: '\.(top|xyz|pw|cc|su|tk|ml|ga|cf|gq|icu|cyou|cfd|sbs|rest|bond|click|zip|mov|cam|monster|quest)$'}
    why: "These top-level domains are cheap or free and show up far more often in phishing and malware than in ordinary browsing. Most lookups are still harmless."
    response: "Check which app asked. Investigate the domain if you do not recognise it."
    action: alert

  - id: "SIG-REC-003"
    description: "TCP Xmas-scan packets (FIN+PSH+URG)"
    message: "Xmas-scan packets from {src_ip} to {dst_ip}"
    severity: MEDIUM
    confidence: 0.85
    mitre: "T1046"
    tags: [recon, portscan, stealth_scan]
    match:
      all:
        - {field: tcp.xmas, op: eq, value: true}
        - {field: tcp.syn, op: eq, value: false}
        - {field: tcp.ack, op: eq, value: false}
    threshold: {count: 3, seconds: 20}
    why: "No normal TCP stack sends FIN, PSH and URG together without ACK. Scanners use it to map open ports past simple firewalls (nmap -sX)."
    response: "Find out who owns the source address. From your own network it is a scanner or a compromised device."
    action: alert

  - id: "SIG-REC-004"
    description: "TCP null-scan packets (no flags set)"
    message: "Null-scan packets from {src_ip} to {dst_ip}"
    severity: MEDIUM
    confidence: 0.75
    mitre: "T1046"
    tags: [recon, portscan, stealth_scan]
    match:
      all:
        - {field: tcp.null, op: eq, value: true}
        - {field: src_port, op: exists}
        - {field: payload_len, op: eq, value: 0}
        - {field: src_scope, op: ne, value: loopback}
    threshold: {count: 5, seconds: 20}
    why: "A TCP segment without any flag is invalid. It is the signature of a null scan (nmap -sN)."
    response: "Find out who owns the source address."
    action: alert

  - id: "SIG-REC-005"
    description: "Lookup of a what-is-my-IP service"
    message: "Public IP address check via {layer7.dns.query_name}"
    severity: LOW
    confidence: 0.3
    mitre: "T1016"
    tags: [discovery, external_ip]
    match:
      all:
        - {field: layer7.dns.is_response, op: eq, value: false}
        - {field: layer7.dns.query_name, op: regex,
           value: '^(api6?\.ipify\.org|ifconfig\.(me|co|io)|icanhazip\.com|ipv4\.icanhazip\.com|ip-api\.com|checkip\.amazonaws\.com|checkip\.dyndns\.(org|com)|ipinfo\.io|myexternalip\.com|wtfismyip\.com|ipecho\.net|ident\.me|api\.myip\.com|ip\.sb|api\.ip\.sb|l2\.io|eth0\.me)$'}
    why: "Malware commonly asks one of these services for the victim's public address right after it starts. VPN clients, routers and scripts do the same."
    response: "Harmless from a tool you run on purpose. Worth a look when the app is unknown or unsigned."
    action: alert

  # =========================================================================
  # Initial access / exploitation
  # =========================================================================

  - id: "SIG-EXP-004"
    description: "Shellshock exploit attempt (bash CVE-2014-6271)"
    message: "Shellshock exploit attempt from {src_ip} against {dst_ip}:{dst_port}"
    severity: CRITICAL
    confidence: 0.97
    mitre: "T1190"
    tags: [shellshock, rce, initial_access]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - {field: payload_bytes, op: regex, value: '\(\)\s*\{\s*:\s*;\s*\}\s*;'}
    why: "The byte sequence '() { :;};' in a request header makes vulnerable bash versions run whatever follows."
    response: "If the target is yours, confirm bash is patched and check its logs for the command that followed."
    action: alert

  - id: "SIG-EXP-005"
    description: "Log4Shell exploit attempt (CVE-2021-44228)"
    message: "Log4Shell exploit string from {src_ip} to {dst_ip}:{dst_port}"
    severity: CRITICAL
    confidence: 0.95
    mitre: "T1190"
    tags: [log4shell, rce, initial_access]
    match:
      any:
        - {field: payload_bytes, op: regex,
           value: '\$\{jndi:(ldaps?|rmi|dns|iiop|corba|nds|https?)://'}
        - {field: payload_bytes, op: regex,
           value: '\$\{(\$\{[^}]{1,40}\}|[jndi:]){1,12}\$\{(lower|upper|::-|env:|sys:|date:)'}
        - {field: payload_bytes, op: regex, value: '\$\{\$\{::-j\}'}
    why: "A JNDI lookup string in logged input makes vulnerable Log4j versions download and run remote code. The second and third patterns catch the usual obfuscations."
    response: "If the target runs Java, check its Log4j version and outbound LDAP/RMI/DNS connections right after this request."
    action: alert

  - id: "SIG-EXP-006"
    description: "SMBv1 negotiation (deprecated protocol, EternalBlue attack surface)"
    message: "SMBv1 negotiation from {src_ip} to {dst_ip}"
    severity: MEDIUM
    confidence: 0.8
    mitre: "T1210"
    tags: [smb, smbv1, eternalblue]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - {field: dst_port, op: in, value: [445, 139]}
        - {field: payload_bytes, op: contains, value: '\xffSMB\x72'}
    why: "SMB version 1 is the protocol EternalBlue / WannaCry (MS17-010) exploit. Modern systems negotiate SMB 2 or 3; a host still offering only version 1 is old, misconfigured, or a tool probing for the vulnerability."
    response: "Identify the client. Disable SMBv1 on anything that still accepts it."
    action: alert

  - id: "SIG-EXP-007"
    description: "Spring4Shell exploit attempt (CVE-2022-22965)"
    message: "Spring4Shell exploit attempt from {src_ip} against {dst_ip}:{dst_port}"
    severity: CRITICAL
    confidence: 0.9
    mitre: "T1190"
    tags: [spring4shell, rce, initial_access]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - {field: payload_bytes, op: regex, value: 'class\.module\.classLoader\.(resources|URLs|defaultAssertionStatus)'}
    why: "Setting class.module.classLoader properties through request parameters is the Spring4Shell technique for writing a web shell."
    response: "If the target runs Spring on JDK 9+, patch it and look for new .jsp files in the web root."
    action: alert

  - id: "SIG-EXP-008"
    description: "Request for a secrets or configuration file"
    message: "Probe for a sensitive file: {src_ip} requested {layer7.http.uri} from {dst_ip}"
    severity: MEDIUM
    confidence: 0.8
    mitre: "T1595.003"
    tags: [recon, webapp, sensitive_file]
    match:
      all:
        - {field: layer7.http.direction, op: eq, value: request}
        - {field: layer7.http.uri, op: regex,
           value: '(/\.env(\.[a-z]+)?(\?|$)|/\.git/(config|HEAD|index)|/\.aws/credentials|/\.ssh/(id_[a-z0-9]+|authorized_keys)|/wp-config\.php(\.bak|\.old|~)?(\?|$)|/\.htpasswd|/\.DS_Store|/config\.(json|ya?ml)\.(bak|old)|/etc/(passwd|shadow)|/proc/self/environ|/phpinfo\.php|/server-status(\?|$)|/actuator/(env|heapdump)|/\.vscode/sftp\.json|/id_rsa(\?|$))'}
    why: "Automated scanners request these paths on every web server they find, hoping for leaked credentials."
    response: "Against your own server: make sure none of these paths answer with 200. From your own machine: something is scanning."
    action: alert

  - id: "SIG-EXP-009"
    description: "Shell command injection in an HTTP request"
    message: "Command injection attempt from {src_ip}: {layer7.http.uri}"
    severity: HIGH
    confidence: 0.75
    mitre: "T1190"
    tags: [command_injection, rce, webapp]
    match:
      all:
        - {field: layer7.http.direction, op: eq, value: request}
        - {field: layer7.http.uri, op: regex,
           value: '(;|%3b|\||%7c|`|%60|\$\(|%24%28|&&|%26%26)(\s|%20|\+|\$\{IFS\})*(wget|curl|nc|ncat|bash|sh|python[23]?|perl|chmod|busybox|tftp|powershell|certutil)(\s|%20|\+|\$\{IFS\}|$)'}
    why: "A shell separator followed by a download or shell command in a URL is an attempt to make the server run it."
    response: "Check whether the target answered 200 and whether it then opened an outbound connection."
    action: alert

  - id: "SIG-EXP-010"
    description: "Known remote-code-execution probe (IoT botnets, PHPUnit, ThinkPHP, Apache traversal)"
    message: "Known exploit probe from {src_ip}: {layer7.http.uri}"
    severity: HIGH
    confidence: 0.9
    mitre: "T1190"
    tags: [exploit_probe, rce, botnet]
    match:
      all:
        - {field: layer7.http.direction, op: eq, value: request}
        - {field: layer7.http.uri, op: regex,
           value: '(vendor/phpunit/.{0,40}eval-stdin\.php|/cgi-bin/(\.%2e|%2e%2e|\.\.)/|/cgi-bin/%%32%65|invokefunction&function=call_user_func_array|/shell\?cd\+/tmp|/boaform/admin/formLogin|/GponForm/diag_Form|/setup\.cgi\?next_file=|/HNAP1/?$|/tmUnblock\.cgi|/ctrlt/DeviceUpgrade|/picsdesc\.xml|/wanipcn\.xml|/_ignition/execute-solution|/solr/admin/(info|cores)|/owa/auth/x\.js|/ecp/default\.flt|/autodiscover/autodiscover\.json\?@)'}
    why: "Each of these paths belongs to a published exploit that botnets (Mirai family and others) spray at every reachable address."
    response: "Background noise against a patched server. If the target is a router, camera or old web app, patch or isolate it."
    action: alert

  # =========================================================================
  # Execution — shells and download cradles seen on the wire
  # =========================================================================

  - id: "SIG-EXE-001"
    description: "Reverse shell command on the wire (bash / netcat)"
    message: "Reverse shell command in traffic {src_ip} → {dst_ip}:{dst_port}"
    severity: CRITICAL
    confidence: 0.9
    mitre: "T1059.004"
    tags: [reverse_shell, execution]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - any:
            - {field: payload_bytes, op: regex, value: '(ba|z|da)?sh\s+-i\s+[0-9]?>&?\s*/dev/(tcp|udp)/'}
            - {field: payload_bytes, op: regex, value: '/dev/(tcp|udp)/[\w.\-]{4,}/\d{2,5}\s+0>&1'}
            - {field: payload_bytes, op: regex, value: '\bn(c|cat)(\.exe)?\s+(-\w+\s+)*-e\s+(/bin/(ba)?sh|cmd(\.exe)?)'}
            - {field: payload_bytes, op: regex, value: 'mkfifo\s+/tmp/\w+\s*;.{0,80}\bnc\b'}
    why: "These one-liners connect a shell on the victim back to an attacker. Seeing one in transit means it is being delivered or typed over an unencrypted channel."
    response: "Treat the destination of the embedded address as attacker infrastructure. Check the target host for the resulting connection."
    action: alert

  - id: "SIG-EXE-002"
    description: "Reverse shell — Python one-liner"
    message: "Python reverse shell code in traffic {src_ip} → {dst_ip}:{dst_port}"
    severity: CRITICAL
    confidence: 0.85
    mitre: "T1059.006"
    tags: [reverse_shell, execution, python]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - any:
            - {field: payload_bytes, op: regex, value: 'import\s+socket\s*,\s*subprocess\s*,\s*os'}
            - {field: payload_bytes, op: regex, value: 'socket\.socket\([^)]{0,60}\).{0,200}(subprocess\.(call|Popen|run)|pty\.spawn|os\.dup2)'}
    why: "The classic Python reverse shell imports socket, subprocess and os in one statement, then ties a socket to a shell."
    response: "Find the host that received this and look for a python process with an outbound connection."
    action: alert

  - id: "SIG-EXE-003"
    description: "PowerShell download cradle or encoded command"
    message: "PowerShell download / encoded command in traffic {src_ip} → {dst_ip}:{dst_port}"
    severity: HIGH
    confidence: 0.85
    mitre: "T1059.001"
    tags: [execution, powershell, download_cradle]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - any:
            - {field: payload_bytes, op: regex, value: 'IEX\s*\(?.{0,80}(DownloadString|Invoke-WebRequest|iwr\s)'}
            - {field: payload_bytes, op: regex, value: 'powershell(\.exe)?\s.{0,120}-(e|en|enc|enco|encodedcommand)\s+[A-Za-z0-9+/=]{40,}'}
            - {field: payload_bytes, op: regex, value: 'New-Object\s+(System\.)?Net\.WebClient\)?\.Download(String|File)'}
            - {field: payload_bytes, op: regex, value: 'powershell.{0,80}-w(indowstyle)?\s+hidden.{0,120}(http|frombase64string)'}
    why: "These are the standard ways malware makes PowerShell fetch and run a second stage without touching disk."
    response: "Identify the Windows host involved and decode the command."
    action: alert

  - id: "SIG-EXE-005"
    description: "Windows command prompt banner inside a TCP stream"
    message: "Windows shell banner sent by {src_ip} to {dst_ip}:{dst_port} — possible reverse shell"
    severity: HIGH
    confidence: 0.8
    mitre: "T1059.003"
    tags: [reverse_shell, execution, windows]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - {field: dst_port, op: not_in, value: [23]}
        - {field: src_port, op: not_in, value: [23]}
        - {field: payload_bytes, op: regex, value: 'Microsoft Windows \[Version [\d.]+\][\s\S]{0,120}Microsoft Corp'}
    why: "cmd.exe prints this banner when it starts. Over a raw TCP connection it means a Windows shell is attached to the network."
    response: "The sender is the machine running the shell. Isolate it and find the process."
    action: alert

  - id: "SIG-EXE-006"
    description: "Output of the 'id' command showing root, inside a TCP stream"
    message: "Root shell output (uid=0) sent by {src_ip} to {dst_ip}:{dst_port}"
    severity: HIGH
    confidence: 0.7
    mitre: "T1059.004"
    tags: [reverse_shell, execution, attack_response]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - {field: payload_bytes, op: regex, value: 'uid=0\(root\)\s+gid=0\((root|wheel)\)'}
    why: "Attackers run 'id' first thing after an exploit lands. Its output crossing the network unencrypted means someone has a root shell on the sender."
    response: "Investigate the sending host immediately."
    action: alert

  # =========================================================================
  # Credential access — secrets crossing the network unencrypted
  # =========================================================================

  - id: "SIG-CRED-001"
    description: "FTP password sent in cleartext"
    message: "FTP password sent in cleartext to {dst_ip}"
    severity: MEDIUM
    confidence: 0.95
    mitre: "T1552"
    tags: [credential_access, ftp, cleartext]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - {field: dst_port, op: eq, value: 21}
        - {field: payload_bytes, op: regex, value: '^PASS\s+\S'}
        - {not: {field: payload_bytes, op: regex, value: '^PASS\s+(anonymous|guest|\S+@\S*)\s*$'}}
    why: "FTP sends the password as plain text. Anyone on the path can read it."
    response: "Switch the transfer to SFTP or FTPS and change the password that was exposed."
    action: alert

  - id: "SIG-CRED-002"
    description: "Telnet connection (unencrypted remote login)"
    message: "Telnet connection {src_ip} → {dst_ip}"
    severity: MEDIUM
    confidence: 0.9
    mitre: "T1021"
    tags: [credential_access, telnet, cleartext]
    match:
      all:
        - {field: tcp.syn, op: eq, value: true}
        - {field: dst_port, op: eq, value: 23}
        - {field: dst_scope, op: ne, value: loopback}
    why: "Telnet carries the login and everything typed afterwards in plain text. It is also the door Mirai-style botnets knock on."
    response: "Use SSH instead. An inbound Telnet attempt from the internet is a botnet scan."
    action: alert

  - id: "SIG-CRED-003"
    description: "HTTP Basic credentials sent without encryption"
    message: "HTTP Basic credentials sent in cleartext to {layer7.http.host} ({dst_ip})"
    severity: MEDIUM
    confidence: 0.9
    mitre: "T1552"
    tags: [credential_access, cleartext, http]
    match:
      all:
        - {field: layer7.http.direction, op: eq, value: request}
        - {field: layer7.http.headers.authorization, op: regex, value: '^Basic\s+[A-Za-z0-9+/=]{4,}'}
        - {field: dst_scope, op: ne, value: loopback}
    why: "Basic authentication is only base64 — over plain HTTP the user name and password are readable by anyone on the path."
    response: "Use HTTPS for this service and change the password."
    action: alert

  - id: "SIG-CRED-005"
    description: "Password submitted in an unencrypted HTTP form"
    message: "Password field posted in cleartext to {layer7.http.host} ({dst_ip})"
    severity: MEDIUM
    confidence: 0.7
    mitre: "T1552"
    tags: [credential_access, cleartext, http]
    match:
      all:
        - {field: layer7.http.method, op: eq, value: POST}
        - {field: dst_scope, op: ne, value: loopback}
        - {field: payload_bytes, op: regex,
           value: '(\r\n\r\n|&)(pass(word|wd)?|pwd|passwd|user_pass|login_password)=[^&\s]{1,}'}
    why: "A login form posted over plain HTTP exposes the password to the local network and every hop after it."
    response: "Do not reuse that password. Use the site's HTTPS address."
    action: alert

  - id: "SIG-CRED-006"
    description: "Mail login sent in cleartext (SMTP / POP3 / IMAP)"
    message: "Mail credentials sent in cleartext to {dst_ip}:{dst_port}"
    severity: MEDIUM
    confidence: 0.85
    mitre: "T1552"
    tags: [credential_access, cleartext, mail]
    match:
      all:
        - {field: protocol, op: eq, value: tcp}
        - {field: dst_port, op: in, value: [25, 110, 143, 587]}
        - {field: payload_bytes, op: regex, value: '^(AUTH\s+(PLAIN|LOGIN)\b|\S+\s+LOGIN\s+\S+\s+\S+|PASS\s+\S+)'}
    why: "The mail client authenticated before (or without) switching to TLS."
    response: "Require TLS in the mail account settings (ports 465 / 993 / 995, or STARTTLS mandatory)."
    action: alert

  - id: "SIG-CRED-007"
    description: "NTLM authentication offered to an internet host over HTTP"
    message: "NTLM authentication sent to internet host {layer7.http.host} ({dst_ip})"
    severity: HIGH
    confidence: 0.8
    mitre: "T1187"
    tags: [credential_access, ntlm, forced_authentication]
    match:
      all:
        - {field: layer7.http.direction, op: eq, value: request}
        - {field: layer7.http.headers.authorization, op: regex, value: '^(NTLM|Negotiate)\s+TlRMTVNT'}
        - {field: dst_scope, op: eq, value: public}
    why: "NTLM challenge-responses can be cracked offline or relayed. A machine should only ever offer them to servers inside its own organisation."
    response: "Find what triggered the request (a document, a link, a UNC path) and treat the account's password as exposed."
    action: alert

  - id: "SIG-CRED-008"
    description: "Outbound SMB connection to the internet"
    message: "SMB connection to internet host {dst_ip}"
    severity: HIGH
    confidence: 0.85
    mitre: "T1187"
    tags: [credential_access, smb, forced_authentication]
    match:
      all:
        - {field: tcp.syn, op: eq, value: true}
        - {field: dst_port, op: in, value: [445, 139]}
        - {field: dst_scope, op: eq, value: public}
        - {field: src_scope, op: ne, value: public}
    why: "File sharing to an internet address is almost never intended. Attackers plant links to remote shares so the system sends its login hash automatically."
    response: "Find the document, e-mail or page that referenced the share. Block outbound port 445 at the router."
    action: alert

  # =========================================================================
  # Lateral movement / remote access
  # =========================================================================

  - id: "SIG-LAT-001"
    description: "Inbound SMB connection from the internet"
    message: "SMB connection attempt from internet host {src_ip} to {dst_ip}"
    severity: HIGH
    confidence: 0.9
    mitre: "T1021.002"
    tags: [lateral_movement, smb, exposed_service]
    match:
      all:
        - {field: tcp.syn, op: eq, value: true}
        - {field: dst_port, op: in, value: [445, 139]}
        - {field: src_scope, op: eq, value: public}
        - {field: dst_scope, op: ne, value: public}
    why: "File sharing reachable from the internet is scanned and attacked constantly (EternalBlue, password guessing, ransomware)."
    response: "Close port 445 on the router or firewall. File sharing should never be internet-facing."
    action: alert

  - id: "SIG-LAT-002"
    description: "Remote Desktop connection from the internet"
    message: "Remote Desktop (RDP) connection attempt from internet host {src_ip} to {dst_ip}"
    severity: HIGH
    confidence: 0.9
    mitre: "T1021.001"
    tags: [lateral_movement, rdp, exposed_service]
    match:
      all:
        - {field: tcp.syn, op: eq, value: true}
        - {field: dst_port, op: eq, value: 3389}
        - {field: src_scope, op: eq, value: public}
        - {field: dst_scope, op: ne, value: public}
    why: "Exposed RDP is one of the most common ways ransomware crews get in."
    response: "Put RDP behind a VPN. Review the Windows security log for successful logons from this address."
    action: alert

  - id: "SIG-LAT-003"
    description: "Incoming screen-sharing (VNC) connection"
    message: "Screen sharing (VNC) connection attempt from {src_ip} to {dst_ip}:{dst_port}"
    severity: MEDIUM
    confidence: 0.7
    mitre: "T1021.005"
    tags: [lateral_movement, vnc, remote_access]
    match:
      all:
        - {field: tcp.syn, op: eq, value: true}
        - {field: dst_port, op: in, value: [5900, 5901, 5902]}
        - {field: dst_scope, op: ne, value: loopback}
        - {not: {field: direction, op: eq, value: outbound}}
    why: "Someone is trying to view or control a screen. Expected if you use Screen Sharing; otherwise it is an intrusion attempt."
    response: "If you did not start this, turn off Screen Sharing / Remote Management in System Settings."
    action: alert

  - id: "SIG-LAT-004"
    description: "Incoming WinRM remote-management connection"
