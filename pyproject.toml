[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[project]
name = "pynids"
version = "2.0.0"
description = "Network intrusion detection and privacy X-Ray for macOS and Linux: signature, anomaly, behavioral and live threat-intel detection, per-app attribution, encrypted-SNI visibility, a background daemon, web dashboard, menu bar app and widget."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Your Name" }
]
keywords = ["nids", "ids", "security", "network", "intrusion-detection", "scapy", "cybersecurity"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: System :: Networking :: Monitoring",
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Developers",
]
dependencies = [
  "scapy>=2.5.0",
  "PyYAML>=6.0.0",
  "click>=8.1.0",
  "rich>=13.0.0",
  "psutil>=5.9.0",          # per-connection app attribution
  "cryptography>=41.0.0",   # QUIC Initial decryption (SNI of HTTP/3 connections)
]

[project.optional-dependencies]
geo = ["maxminddb>=2.4.0"]          # offline GeoIP / ASN (pynids geoip download)
ai = ["anthropic>=0.75.0"]          # "Explain with Claude"
all = ["maxminddb>=2.4.0", "anthropic>=0.75.0"]
dev = [
  "pytest>=7.4.0",
  "pytest-cov>=4.1.0",
]

[project.scripts]
pynids = "pynids.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pynids"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = ["ignore:.*Diffie-Hellman over finite fields.*"]

[tool.coverage.run]
source = ["pynids"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
